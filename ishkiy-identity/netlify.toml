[build]
  publish = "site"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), camera=(self)"

# Records the spoken guides with ElevenLabs when a key and voice are set.
[[plugins]]
  package = "./plugins/eleven-voice"

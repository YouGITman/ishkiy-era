<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iSHKiY Identity</title>
<meta name="description" content="Let the old you go. Write who you are now, hear it in your own voice, and live it for 21 days." />
<meta name="theme-color" content="#0F1E3D" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Identity" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* The ERA palette. Identity lives mostly on ink: it's used at dawn and at
     bedtime, in the dark, and a bright screen is the last thing either needs. */
  :root{
    --ink:#0F1E3D; --ink2:#16284D; --ink3:#1D325C; --bone:#F5F1E8; --gold:#D4A547; --gold2:#B08630;
    --bone70:rgba(245,241,232,.72); --bone50:rgba(245,241,232,.52); --bone22:rgba(245,241,232,.22); --bone10:rgba(245,241,232,.08);
    --goldsoft:rgba(212,165,71,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--ink)}
  body{color:var(--bone); font-family:Inter,system-ui,sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea{font:inherit; color:inherit}
  a{color:inherit}

  .shell{position:relative; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:calc(18px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); background:radial-gradient(120% 70% at 50% 0%, #1A2F5A 0%, var(--ink) 60%); overflow-x:hidden; animation:screenfade .6s ease both}
  .shell.withtabs{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .col{position:relative; z-index:1; width:100%; max-width:540px; flex:1; display:flex; flex-direction:column}
  .field{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
  @keyframes screenfade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* wordmark */
  .wmrow{display:flex; align-items:baseline; gap:10px}
  .wordmark{font-family:Lora,serif; font-weight:700; font-size:28px; letter-spacing:.5px; color:var(--ink); user-select:none}
  .wordmark.light{color:var(--bone)}
  .wm-i{position:relative; display:inline-block}
  .tittle{position:absolute; top:.06em; left:50%; transform:translateX(-50%); width:.16em; height:.16em; border-radius:50%; background:var(--gold)}
  .wmsub{font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}

  .kicker{font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 10px}
  .display{font-family:Lora,serif; font-weight:700; font-size:34px; line-height:1.15; letter-spacing:-.01em; margin:0 0 14px}
  .display.sm{font-size:28px}
  .display.quote{font-style:italic; font-weight:600}
  .lede{font-size:17px; line-height:1.6; margin:0 0 14px}
  .lede.dim{color:var(--bone70); font-size:15.5px}
  .tnote{font-size:13.5px; line-height:1.6; margin:10px 0 0; color:var(--bone50)}
  .hint{font-size:13.5px; color:var(--gold); margin:6px 0 0}
  .count{font-size:13px; color:var(--bone50); font-variant-numeric:tabular-nums}
  .q{display:block; font-family:Lora,serif; font-weight:600; font-size:18px; line-height:1.35; margin:22px 0 10px}

  .btn{display:inline-block; padding:15px 26px; border-radius:12px; font-weight:600; font-size:16px; margin-top:18px; align-self:flex-start; transition:transform .12s ease, opacity .12s; text-decoration:none; text-align:center}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.38; cursor:default}
  .btn.gold{background:var(--gold); color:var(--ink)}
  .btn.ink2{background:var(--bone10); color:var(--bone); border:1.5px solid var(--bone22)}
  .btn.danger{background:#C0504D; color:#fff}
  .btn.small{padding:10px 16px; font-size:14px; margin-top:10px}
  .ghost{color:var(--bone70); font-size:15px; padding:10px 4px; margin-top:8px; align-self:flex-start; text-decoration:underline; text-decoration-color:var(--bone22); text-underline-offset:4px}
  .center .ghost,.glimmer .ghost{align-self:center}
  .btn:focus-visible,.ghost:focus-visible,.opt:focus-visible,.chip:focus-visible,.tcard:focus-visible,.bed:focus-visible,.hold:focus-visible,.back:focus-visible,.tab:focus-visible,.pstep button:focus-visible,.oldcard:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .row{display:flex; gap:10px; align-items:center} .row.wrap{flex-wrap:wrap} .row .btn{margin-top:10px}

  .toprow{display:flex; justify-content:space-between; align-items:center; min-height:40px; margin-bottom:4px}
  .back{color:var(--bone70); font-size:14px; font-weight:600; padding:8px 12px 8px 0}
  .dots{display:flex; gap:8px}
  .dot{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--bone22)}
  .dot.done{background:var(--gold); border-color:var(--gold)} .dot.now{border-color:var(--gold)}

  .center{display:flex; flex-direction:column; align-items:center; text-align:center}
  .grow{flex:1; justify-content:center}
  .center-text{text-align:center}
  .glimmer{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 0; animation:rise .45s ease}
  .glimmer .btn,.center .btn{align-self:center}
  .gline{font-family:Lora,serif; font-size:24px; line-height:1.4; max-width:440px; margin:22px 0 0; animation:rise .6s ease}
  .gline.small{font-size:20px}
  .bquote{font-size:25px; font-style:italic}
  .gsub{color:var(--bone70); font-size:15.5px; line-height:1.65; margin:14px 0 0; max-width:440px}
  .gsub.left{text-align:left}
  .bfoot{margin-top:48px; opacity:.7}
  .eart{width:220px; max-width:70%; margin-bottom:22px}
  .eart .fly{animation:fly 2.4s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-6px)}}
  .eart .band{animation:band 3.2s ease-in-out infinite; transform-origin:40px 70px}
  @keyframes band{0%,100%{transform:scaleX(1)} 70%{transform:scaleX(1)} 85%{transform:scaleX(.55)}}

  /* welcome */
  .welcome{flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 0}
  .welcome .wmrow{margin-bottom:26px}
  .steps{display:flex; flex-direction:column; gap:12px; margin:6px 0 18px}
  .step{display:flex; gap:12px; align-items:flex-start; font-size:15.5px; line-height:1.55}
  .stepn{flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:rgba(212,165,71,.2); border:1.5px solid var(--gold); color:var(--gold); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:1px}

  /* the path */
  .home{flex:1; display:flex; flex-direction:column; padding:18px 0}
  .hgreet{margin-top:28px}
  .path{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:10px}
  .pstep button{width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:15px 16px; border-radius:16px; border:1.5px solid var(--bone10); background:rgba(245,241,232,.04)}
  .pstep button:disabled{opacity:.42; cursor:default}
  .pstep.next button{border-color:var(--gold); background:var(--goldsoft)}
  .pnum{flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--bone22); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--bone70)}
  .pstep.done .pnum{background:var(--gold); border-color:var(--gold); color:var(--ink)}
  .pstep.next .pnum{border-color:var(--gold); color:var(--gold)}
  .ptext{flex:1; display:flex; flex-direction:column}
  .pname{font-family:Lora,serif; font-weight:700; font-size:18px}
  .pline{font-size:13.5px; color:var(--bone50)}
  .pgo{font-size:13px; font-weight:600; color:var(--ink); background:var(--gold); padding:6px 12px; border-radius:999px}
  .linkrow{display:flex; gap:18px; margin-top:22px}

  /* forms */
  .flow{display:flex; flex-direction:column; padding:10px 0 20px; animation:rise .35s ease}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{padding:10px 15px; border-radius:999px; border:1.5px solid var(--bone22); font-size:14.5px; font-weight:500; background:rgba(245,241,232,.03)}
  .chip.on{border-color:var(--acc, var(--gold)); background:color-mix(in srgb, var(--acc, #D4A547) 22%, transparent); color:var(--bone)}
  .optlist{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; align-items:center; gap:12px; text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--bone10); background:rgba(245,241,232,.04); font-size:16px; line-height:1.4}
  .opt.sel{border-color:var(--gold); background:var(--goldsoft)}
  .odot{flex:0 0 auto; width:10px; height:10px; border-radius:50%; border:1.5px solid var(--bone22)}
  .opt.sel .odot{background:var(--gold); border-color:var(--gold)}
  .tin,.tarea{width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid var(--bone22); background:rgba(245,241,232,.05); color:var(--bone); resize:vertical; font-size:16px}
  .tin::placeholder,.tarea::placeholder{color:var(--bone22)}
  .tin:focus,.tarea:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold)}
  .tin.big,.tarea.big{font-family:Lora,serif; font-size:19px; line-height:1.45}
  .tarea.script{min-height:46vh; font-family:Lora,serif; font-size:16.5px; line-height:1.7}
  .askrow{display:flex; gap:8px; align-items:flex-start; margin-top:12px} .askrow .tin,.askrow .tarea{flex:1} .askrow .btn{margin-top:0}
  input[type=range]{width:100%; accent-color:var(--gold); height:30px}
  input[type=time]{color-scheme:dark; margin-top:6px}
  .slider{margin:14px 0 4px}
  .sliderlabels{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--bone50)}
  .sliderlabels b{font-family:Lora,serif; font-size:26px; color:var(--gold)}

  /* the old you */
  .oldlist{display:flex; flex-direction:column; gap:10px; margin-top:6px}
  .oldcard{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:16px 16px 14px; border-radius:14px; background:rgba(245,241,232,.04); border:1.5px solid var(--bone10); border-left:4px solid var(--acc)}
  .oldtext{font-family:Lora,serif; font-style:italic; font-size:18px; line-height:1.35}
  .oldmeta{font-size:13px; color:var(--gold)}

  /* letting go */
  .release{justify-content:center}
  .dissolve{width:100%; height:190px; margin:18px 0 6px}
  .hold{position:relative; overflow:hidden; margin-top:22px; padding:18px 30px; border-radius:999px; border:1.5px solid var(--gold); color:var(--gold); font-weight:600; user-select:none; -webkit-user-select:none; touch-action:none}
  .holdfill{position:absolute; inset:0; background:var(--gold); transform-origin:left; transform:scaleX(var(--p)); opacity:.9}
  .holdlabel{position:relative; mix-blend-mode:normal}
  .hold .holdlabel{color:color-mix(in srgb, var(--ink) calc(var(--p) * 100%), var(--gold))}

  /* the new you */
  .newline{margin:14px 0 4px; padding-left:12px; border-left:3px solid var(--acc)}
  .was{font-size:13.5px; color:var(--bone50); font-style:italic; margin:0 0 6px; text-decoration:line-through; text-decoration-color:rgba(212,165,71,.6)}
  .mini{font-size:12.5px; color:var(--bone50); margin-top:6px; text-decoration:underline}

  /* practices */
  .session{flex:1; justify-content:center; padding:18px 0}
  .orb{display:flex; align-items:center; justify-content:center; margin:0 auto}
  .orb svg{overflow:visible}
  .orb .orb-core,.orb .orb-halo{transform-origin:100px 100px; animation:breathe 10s ease-in-out infinite}
  .orb .orb-ring{transform-origin:100px 100px; animation:ring 10s ease-in-out infinite}
  .orb .orb-ring.r2{animation-delay:-1.2s}
  .orb.still .orb-core,.orb.still .orb-halo,.orb.still .orb-ring{animation:none}
  @keyframes breathe{0%,100%{transform:scale(.82)} 50%{transform:scale(1.12)}}
  @keyframes ring{0%,100%{transform:scale(.9); opacity:.5} 50%{transform:scale(1.18); opacity:1}}
  .mantra{font-family:Lora,serif; font-style:italic; color:var(--gold); font-size:17px; margin:18px 0 0}
  .meter{width:100%; max-width:320px; height:3px; background:var(--bone10); border-radius:2px; margin:26px auto 8px; overflow:hidden}
  .meterfill{height:100%; background:var(--gold); transition:width .3s linear}
  .sleepdim{background:#000; margin:-18px -20px; padding:18px 20px; min-height:100dvh; transition:background 2s}
  .sleepdim .orb{opacity:.35}
  .sleepdim .gsub,.sleepdim .gline{opacity:.35}
  .sayring{position:relative; border-radius:50%; padding:6px; background:conic-gradient(var(--gold) calc(var(--p) * 360deg), var(--bone10) 0)}
  .sayring .orb{background:var(--ink); border-radius:50%}
  .sayline{font-family:Lora,serif; font-weight:600; font-size:27px; line-height:1.3; max-width:460px; margin:26px 0 4px; animation:rise .5s ease}
  .mirror{position:relative; width:100%; max-width:360px; aspect-ratio:3/4; border-radius:24px; overflow:hidden; border:2px solid rgba(212,165,71,.5); margin:10px auto 16px; background:#000}
  .mirror video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
  .mirrorline{position:absolute; left:0; right:0; bottom:0; margin:0; padding:40px 18px 18px; font-family:Lora,serif; font-weight:600; font-size:21px; line-height:1.35; background:linear-gradient(transparent, rgba(15,30,61,.85))}
  .recorder{display:flex; flex-direction:column}
  .recbar{position:sticky; top:8px; z-index:2; display:flex; align-items:center; gap:14px; padding:10px 12px 10px 16px; border-radius:999px; background:rgba(22,40,77,.94); border:1.5px solid rgba(212,165,71,.4)}
  .recbar .count{flex:1} .recbar .btn{margin:0; padding:10px 20px}
  .recdot{width:12px; height:12px; border-radius:50%; background:#E0655A; transition:transform .08s}
  .prompter{margin-top:18px; font-family:Lora,serif; font-size:19px; line-height:1.75; color:var(--bone70)}
  .prompter.live{color:var(--bone); font-size:21px}
  .prompter p{margin:0 0 20px}

  /* begin */
  .plan{display:flex; flex-direction:column; gap:1px; border-radius:16px; overflow:hidden; margin:8px 0 6px; border:1.5px solid var(--bone10)}
  .planrow{display:flex; flex-direction:column; gap:3px; padding:14px 16px; background:rgba(245,241,232,.04); font-size:15px; line-height:1.5}
  .planwhen{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
  .times{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
  .times label{font-size:13px; color:var(--bone70); display:flex; flex-direction:column}

  /* today */
  .today{display:flex; flex-direction:column; gap:12px; padding:4px 0}
  .todayhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
  .todayhead .wordmark{font-size:22px}
  .idcard{padding:22px 20px 18px; border-radius:20px; background:linear-gradient(160deg, rgba(212,165,71,.2), rgba(212,165,71,.04) 60%); border:1.5px solid rgba(212,165,71,.35)}
  .idline{font-family:Lora,serif; font-weight:600; font-size:24px; line-height:1.3; margin:0 0 16px; min-height:2.6em; animation:rise .7s ease}
  .eradots{display:grid; grid-template-columns:repeat(21, 1fr); gap:4px}
  .ed{aspect-ratio:1; border-radius:50%; border:1.2px solid var(--bone22)}
  .ed.half{background:linear-gradient(90deg, var(--gold) 50%, transparent 50%); border-color:var(--gold)}
  .ed.full{background:var(--gold); border-color:var(--gold)}
  .ed.now{box-shadow:0 0 0 2px rgba(212,165,71,.45)}
  .ed.future{opacity:.45}
  .gentle{margin:0; font-size:14.5px; color:var(--bone70); padding:12px 14px; border-radius:12px; background:var(--bone10)}
  .tcard{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:18px; border-radius:18px; border:1.5px solid var(--bone10); background:rgba(245,241,232,.04)}
  .tcard.accent{border-color:var(--gold); background:var(--goldsoft)}
  .tcard.done{opacity:.7}
  .tcard.soft .tct::after{content:" · still time"; font-family:Inter; font-weight:500; font-size:13px; color:var(--bone50)}
  .tck{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); display:flex; gap:6px; align-items:center}
  .tick{width:16px; height:16px; border-radius:50%; background:var(--gold); color:var(--ink); font-size:10px; display:inline-flex; align-items:center; justify-content:center}
  .tct{font-family:Lora,serif; font-weight:700; font-size:21px}
  .tcl{font-size:14.5px; color:var(--bone70); line-height:1.5}
  .tcgo{font-size:14px; font-weight:600; color:var(--gold); margin-top:6px}
  .daycard{padding:18px; border-radius:18px; border:1.5px dashed var(--bone22)}
  .pq{font-family:Lora,serif; font-style:italic; font-size:19px; line-height:1.4; margin:0 0 4px}
  .hquote{margin:18px 0 0; text-align:center; font-family:Lora,serif; font-style:italic; font-size:15px; color:var(--bone50)}

  /* tabs */
  .tabs{position:fixed; z-index:5; left:0; right:0; bottom:0; display:flex; justify-content:space-around; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:rgba(12,24,50,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--bone10)}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 14px; font-size:11.5px; font-weight:600; color:var(--bone50); border-radius:12px}
  .tab.on{color:var(--gold)}

  /* evidence, weekly, review */
  .evlist{display:flex; flex-direction:column; gap:8px; margin-top:18px}
  .ev{display:flex; gap:14px; padding:13px 15px; border-radius:12px; background:rgba(245,241,232,.04); font-size:15.5px; line-height:1.5}
  .evdate{flex:0 0 52px; font-size:12px; font-weight:600; color:var(--gold); padding-top:3px}
  .spark{width:100%; max-width:320px; height:auto; color:var(--bone); margin:6px 0 2px}
  .reflection{max-width:460px; text-align:left; margin-top:18px}
  .reflection p{font-size:16.5px; line-height:1.7; margin:0 0 14px}
  .reflection p:last-child{font-family:Lora,serif; font-style:italic; font-size:20px; color:var(--gold)}
  .versus{display:flex; flex-direction:column; gap:10px; margin:8px 0 18px}
  .vs{padding:14px 16px; border-radius:14px; background:rgba(245,241,232,.04)}
  .vs .now{font-family:Lora,serif; font-weight:600; font-size:19px; margin:0; color:var(--bone)}
  .stats{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:14px}
  .stats div{display:flex; flex-direction:column; align-items:center; padding:12px 4px; border-radius:12px; background:rgba(245,241,232,.05); text-align:center}
  .stats b{font-family:Lora,serif; font-size:24px; color:var(--gold)}
  .stats span{font-size:11.5px; color:var(--bone50); line-height:1.3}

  /* sound room */
  .beds{display:flex; flex-direction:column; gap:9px; margin:4px 0 6px}
  .bed{display:flex; gap:14px; align-items:center; text-align:left; padding:14px 16px; border-radius:14px; border:1.5px solid var(--bone10); background:rgba(245,241,232,.04)}
  .bed.on{border-color:var(--gold); background:var(--goldsoft)}
  .bedplay{flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px}
  .bedtext{display:flex; flex-direction:column}
  .bedname{font-family:Lora,serif; font-weight:700; font-size:17px}
  .bedline{font-size:13.5px; color:var(--bone50); line-height:1.45}
  .panel{margin-top:26px; padding:18px; border-radius:18px; border:1.5px solid var(--bone10); background:rgba(245,241,232,.03); display:flex; flex-direction:column}

  /* you */
  .idlist p{font-family:Lora,serif; font-weight:600; font-size:19px; line-height:1.4; margin:0 0 10px; padding-left:12px; border-left:3px solid var(--acc)}
  .sos{padding:14px 0; border-top:1px solid var(--bone10); display:flex; flex-direction:column}
  .sosname{font-weight:600; margin:0}

  @media (min-width:640px){ .display{font-size:40px} .display.sm{font-size:32px} }
  @media (max-width:360px){ .display{font-size:29px} .display.sm{font-size:25px} .stats{grid-template-columns:1fr 1fr} }
  @media (prefers-reduced-motion: reduce){
    .shell,.glimmer,.flow,.gline,.sayline,.idline{animation:none}
